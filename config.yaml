regions:
  usa_cities: [San Francisco, New York, Austin, Boston, Seattle, Denver, Chicago, Los Angeles, Miami, Atlanta, Raleigh, Washington DC]
  # Broad coverage across UK, Ireland, Germany, Netherlands, France, Spain,
  # Portugal, Sweden, Denmark, Finland, Poland, Estonia, Switzerland and Austria.
  eu_cities: [London, Manchester, Dublin, Berlin, Munich, Hamburg, Amsterdam, Paris, Lyon, Madrid, Barcelona, Lisbon, Stockholm, Copenhagen, Helsinki, Warsaw, Tallinn, Zurich, Vienna]
  eu_countries: [United Kingdom, Ireland, Germany, Netherlands, France, Spain, Portugal, Sweden, Denmark, Finland, Poland, Estonia, Switzerland, Austria]
# Free OpenStreetMap/Overpass discovery: one query per city up to this cap.
# One OpenStreetMap query runs per city. Start modestly to respect the public API.
osm_daily_query_cap: 3
# YC and HN run without keys. OSM is optional because its public service can
# be slow; add google_maps here (legacy module name) when you want it.
enabled_sources: [yc_directory, hn_whos_hiring]
yc_daily_company_cap: 30
hn_comment_cap: 150
crawl_timeout_seconds: 8
crawl_max_concurrency: 10
crawl_retries: 1
output_dir: ./output
